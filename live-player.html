<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بث مباشر</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  #m{color:#bbb;font-family:sans-serif;font-size:15px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="m"></div>
<script>
(function () {
  // صفحة مشغّل تُستضاف على دومين https حقيقي ويحمّلها التطبيق (WebView)،
  // فيصبح referrer/origin سليماً ويشتغل بث الحرمين زي الويب تماماً.
  var v = (new URLSearchParams(location.search)).get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) {
    document.getElementById('m').textContent = 'معرّف فيديو غير صالح';
    return;
  }
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + v + '?autoplay=1&playsinline=1&rel=0';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.setAttribute('allowfullscreen', '');
  document.body.appendChild(f);
})();
</script>
</body>
</html>
