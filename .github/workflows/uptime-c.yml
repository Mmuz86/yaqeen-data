# مراقب يقين من خارج السيرفر — خيط الإشعال (ج).
#
# ليه موجود: كل حرّاس يقين (sentinel, api_watch, healer, responder) بيشتغلوا
# **جوّه** السيرفر. لو الصندوق نفسه طفي — عطل مزوّد، كيرنل، شبكة — الحرّاس
# بيموتوا معاه ومحدّش بيعرف. الفحص ده بيجري على بنية جيت هَب، مستقلة تماماً
# عن السيرفر، فهو اللي بيشوف السقوط الكامل.
#
# القناة: لو الفحص فشل، الـrun بيفشل وجيت هَب بيبعت إيميل لصاحب المستودع
# تلقائياً. مش واتساب (ممنوع)، ومش اللوحة (لأنها بتكون واقعة هي كمان ساعتها).
#
# منطق الفحص: scripts/uptime-probe.sh — منطق الاستمرار: scripts/uptime-relay.sh
#
# ⚠️ الدرس المقاس: جدول جيت هَب (schedule) **مجهود-أفضل بلا ضمان**؛ التوثيق
# بيقول صراحة إن التشغيلات ممكن تتأخّر أو تتسقط وقت الحمل:
#   • 08-26 حلقة ٥٥ د  → ٣٤.٧٪ بلا تغطية      • 08-27 حلقة ٩٠ د → فجوة ٢١٨ د
#   • 08-28 ٣ خيوط بـcron */5 → **صفر** تشغيلة مجدولة في ٣ ساعات (فجوة ٩٤ د)
# تكتير الخيوط ما حلّش المشكلة لأن التلاتة بيعتمدوا على نفس المشعِل غير الموثوق.
# الحل 2026-08-28: **تتابُع ذاتي** — كل تشغيلة بتشعل خليفتها بـworkflow_dispatch
# (قناة فورية موثوقة) في خطوة always()، فالتغطية بتفضل مستمرة حتى لو الجدول
# سقط تماماً. الـcron بقى **إعادة إشعال احتياطية** بس، بمواقيت مزاحة بين
# الخيوط التلاتة، وبفاصل معقول بدل */5 (التكرار العالي نفسه كان بيغرق الجدول).
#
# حارس التكاثر جوّه uptime-relay.sh بيمنع تضاعف التشغيلات من cron + تتابُع معاً.

name: uptime-c

on:
  schedule:
    - cron: '25,55 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write          # لازم عشان التشغيلة تشعل خليفتها

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # حلقة ٨٥ دقيقة + هامش
    steps:
      - uses: actions/checkout@v4

      - name: حلقة فحص الواجهات الثلاث
        run: sh scripts/uptime-probe.sh

      # always(): حتى لو الفحص فشل (يقين ساقط فعلاً) لازم المراقبة تكمّل.
      - name: تتابُع الإشعال — تشغيل الخليفة
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: uptime-c.yml
        run: sh scripts/uptime-relay.sh
