# مراقب يقين من خارج السيرفر — خيط الإشعال (ج). المنطق كله في scripts/uptime-probe.sh والشرح في uptime.yml.
#
# ليه موجود: كل حرّاس يقين (sentinel, api_watch, healer, responder) بيشتغلوا
# **جوّه** السيرفر. لو الصندوق نفسه طفي — عطل مزوّد، كيرنل، شبكة — الحرّاس
# بيموتوا معاه ومحدّش بيعرف. الفحص ده بيجري على بنية جيت هَب، مستقلة تماماً
# عن السيرفر، فهو اللي بيشوف السقوط الكامل.
#
# القناة: لو الفحص فشل، الـrun بيفشل وجيت هَب بيبعت إيميل لصاحب المستودع
# تلقائياً. مش واتساب (ممنوع)، ومش اللوحة (لأنها بتكون واقعة هي كمان ساعتها).
#
# ⚠️ الدرس المقاس (2026-08-27 و 08-28): جدول جيت هَب لخيط واحد **مش موثوق**:
#   • حلقة ٥٥ دقيقة  → ٣٤.٧٪ بلا تغطية، أكبر فجوة ١٢٩ دقيقة
#   • حلقة ٣٥٠ دقيقة → ٣٢.٧٪ بلا تغطية، أكبر فجوة ٣١٧ دقيقة
#   • حلقة ٩٠ دقيقة بخيط واحد → فجوة موثّقة ٢١٨ دقيقة ليل 08-27 (20:17→23:55)
# تطويل الحلقة بيبدّل شكل الفجوة مش بيشيلها، لأن الفجوة أصلها **تأخّر الإشعال**
# بلا سقف. الحل 2026-08-28: **٣ خيوط إشعال مستقلة** (uptime, uptime-b,
# uptime-c) بنفس السكربت وبمواقيت مزاحة. تأخّر خيط ما بيفتحش فجوة طالما خيط
# تاني اشتغل — احتمال تأخّر التلاتة مع بعض أقل بمراتب من تأخّر واحد.
#
# مفيش `concurrency` عن قصد: التشغيلات بتتراكب بدل ما تلغي بعض، والتراكب هو
# اللي بيقفل الفجوة. المستودع عام فدقايق التشغيل مجانية.
name: uptime-c

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # ٩٠ دقيقة حلقة + هامش
    steps:
      - uses: actions/checkout@v4
      - name: حلقة فحص الواجهات الثلاث
        run: sh scripts/uptime-probe.sh
