# مراقب يقين من خارج السيرفر.
#
# ليه موجود: كل حرّاس يقين (sentinel, api_watch, healer, responder) بيشتغلوا
# **جوّه** السيرفر. لو الصندوق نفسه طفي — عطل مزوّد، كيرنل، شبكة — الحرّاس
# بيموتوا معاه ومحدّش بيعرف. الفحص ده بيجري على بنية جيت هَب، مستقلة تماماً
# عن 187.127.109.222، فهو الوحيد اللي بيشوف السقوط الكامل.
#
# القناة: لو الفحص فشل، الـrun بيفشل وجيت هَب بيبعت إيميل لصاحب المستودع
# تلقائياً. مش واتساب (ممنوع)، ومش اللوحة (لأنها بتكون واقعة هي كمان ساعتها).
#
# ليه هنا في yaqeen-data وليس مستودع مخصّص: جيت هَب بيوقف الجداول الدورية بعد
# ٦٠ يوم خمول للمستودع. المستودع ده بيتحدّث باستمرار (فتاوى/إصدارات) فالجدول
# بيفضل حيّ. مستودع مخصّص كان هيموت بالصمت بعد شهرين.
#
# ⚠️ درس 2026-08-18: جدول جيت هَب مش موثوق للتردّد العالي. المقاس الفعلي على
# المستودع ده: cron '*/5' اتنفّذ كل ٢٣–٣٥ دقيقة، وفي فجوة وصلت ٨٠ دقيقة بلا
# أي تشغيلة. الحل: كل تشغيلة بقت **حلقة فحص طويلة** (نبضة كل ٥ دقايق لمدة
# ٥٥ دقيقة) بدل نبضة واحدة — فحتى لو جيت هَب أطلقها مرة كل ساعة، التغطية
# بتفضل كل ٥ دقايق تقريباً بلا انقطاع. الجدول بقى «إشعال» مش «إيقاع».
name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# تشغيلة جديدة تلغي القديمة: مانبقاش حلقتين بيلفّوا مع بعض، والأحدث دايماً
# هي الحيّة (عشان عمر آخر تشغيلة يفضل مؤشّر صادق لحارس المراقب).
concurrency:
  group: uptime-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # ٣٥٠ دقيقة حلقة + هامش (حد جيت هَب ٦ ساعات).
    timeout-minutes: 355
    steps:
      - name: حلقة فحص الواجهات الثلاث
        run: |
          set -u

          # ٣ محاولات بينها ١٥ ثانية. السبب: تعافي nginx من قتل مفاجئ بياخد
          # ~٢ ثانية، وإعادة تشغيل الباك إند غير مرئية أصلاً. محاولة واحدة كانت
          # هتقلب كل نبضة صيانة لإنذار كاذب.
          check() {
            name="$1"; url="$2"; min="$3"
            code=000; size=0
            for i in 1 2 3; do
              code=$(curl -sS -o /tmp/probe_body -w '%{http_code}' -m 20 "$url" 2>/dev/null || echo 000)
              size=$(wc -c < /tmp/probe_body 2>/dev/null || echo 0)
              if [ "$code" = "200" ] && [ "$size" -ge "$min" ]; then
                echo "✅ $name — $code، ${size} بايت (محاولة $i)"
                return 0
              fi
              echo "… $name محاولة $i: كود=$code حجم=$size"
              [ "$i" -lt 3 ] && sleep 15
            done
            echo "::error title=$name ساقط::آخر كود=$code حجم=$size — $url"
            return 1
          }

          round() {
            fail=0
            # الحد الأدنى للحجم مقصود: ٢٠٠ بصفحة فاضية = سقوط متنكّر.
            check "الموقع getyaqeen.com"      "https://getyaqeen.com/"               20000 || fail=1
            check "التطبيق app.getyaqeen.com" "https://app.getyaqeen.com/"           20000 || fail=1
            check "الـAPI api.getyaqeen.com"  "https://api.getyaqeen.com/quiz/daily"    10 || fail=1
            return $fail
          }

          # ٧٠ نبضة × ٥ دقايق = ٣٥٠ دقيقة تغطية من تشغيلة واحدة.
          # معايرة 2026-08-27: القياس الفعلي أثبت إن جيت هَب بيطلق التشغيلة كل
          # ٤٥–١٢٩ دقيقة (فجوة موثّقة ٢س٩د بين 20:07 و22:16 يوم 08-26)، فحلقة
          # الـ٥٥ دقيقة كانت بتسيب فجوات تغطية حقيقية. الحلقة الطويلة بتخلّي
          # التغطية متصلة مهما اتأخّر الجدول، والـconcurrency بيضمن إن أي
          # تشغيلة جديدة بتلغي القديمة وتستلم — فمفيش حلقتين مع بعض.
          ROUNDS=70
          GAP=300
          n=1
          while [ "$n" -le "$ROUNDS" ]; do
            echo "──── نبضة $n/$ROUNDS — $(date -u '+%H:%M:%S UTC')"
            if ! round; then
              echo "::error::يقين ساقط من خارج السيرفر (نبضة $n) — راجع اللوج فوق"
              exit 1
            fi
            n=$((n + 1))
            [ "$n" -le "$ROUNDS" ] && sleep "$GAP"
          done
          echo "كل الواجهات سليمة طوال $ROUNDS نبضات."
