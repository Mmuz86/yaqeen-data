# مراقب يقين من خارج السيرفر — **طبقة احتياطية**.
#
# ليه موجود: كل حرّاس يقين (sentinel, api_watch, healer, responder) بيشتغلوا
# **جوّه** السيرفر. لو الصندوق نفسه طفي — عطل مزوّد، كيرنل، شبكة — الحرّاس
# بيموتوا معاه ومحدّش بيعرف. الفحص ده بيجري على بنية جيت هَب، مستقلة تماماً
# عن 187.127.109.222، فهو بيشوف السقوط الكامل.
#
# القناة: لو الفحص فشل، الـrun بيفشل وجيت هَب بيبعت إيميل لصاحب المستودع
# تلقائياً. مش واتساب (ممنوع)، ومش اللوحة (لأنها بتكون واقعة هي كمان ساعتها).
#
# ليه هنا في yaqeen-data وليس مستودع مخصّص: جيت هَب بيوقف الجداول الدورية بعد
# ٦٠ يوم خمول للمستودع. المستودع ده بيتحدّث باستمرار (فتاوى/إصدارات) فالجدول
# بيفضل حيّ. مستودع مخصّص كان هيموت بالصمت بعد شهرين.
#
# ⚠️ الدرس المقاس (2026-08-27): جدول جيت هَب **مش موثوق** كمراقب أساسي، وأي
# معايرة للحلقة مش هتصلّحه. القياس على ٤٠.٧ ساعة فعلية:
#
#   • حلقة ٥٥ دقيقة  → ٣٤.٧٪ من الوقت بلا تغطية، أكبر فجوة ١٢٩ دقيقة
#   • حلقة ٣٥٠ دقيقة → ٣٢.٧٪ من الوقت بلا تغطية، أكبر فجوة ٣١٧ دقيقة
#
# تطويل الحلقة بدّل «فجوات صغيرة متكرّرة» بـ«فجوات نادرة ضخمة» — النسبة تقريباً
# هي هي، لكن الحادثة الواحدة بقت أسوأ ٢.٥×. السبب إن التشغيلة لما بتكمّل
# نبضاتها لوحدها، التغطية بتقع لحد الـtrigger الجاي، وده بيتأخّر بلا سقف.
#
# القرار: المراقب الأساسي بقى خدمة خارجية متخصّصة (UptimeRobot — خطوات الإعداد
# في README تحت «مراقبة التوفّر»). الملف ده بقى **الطبقة التانية**: لو الخدمة
# الخارجية نفسها وقعت أو الحساب اتقفل، ده اللي فاضل.
#
# دور الطبقة التانية بيغيّر التصميم:
#   • حلقة ٩٠ دقيقة (١٨ نبضة) — أطول من متوسّط تأخّر الجدول (٣٠–٦٠ دقيقة)
#   • **مفيش concurrency** — التشغيلات بتتراكب بدل ما تلغي بعض، والتراكب هو
#     اللي بيقفل الفجوة. التغطية بقت من التداخل مش من الطول.
name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# ملحوظة: مفيش `concurrency` عن قصد. الإصدار القديم كان بيلغي التشغيلة الشغّالة
# لما تيجي واحدة جديدة، فالتغطية كانت خيط واحد أي انقطاع فيه = فجوة. دلوقتي
# التشغيلات بتتراكب: تأخّر الجدول بيقلّل التداخل، مش بيفتح فجوة. المستودع عام
# فدقايق التشغيل مجانية بلا سقف — التراكب مش بيكلّف حاجة.

jobs:
  probe:
    runs-on: ubuntu-latest
    # ٩٠ دقيقة حلقة + هامش.
    timeout-minutes: 100
    steps:
      - name: حلقة فحص الواجهات الثلاث
        run: |
          set -u

          # ٣ محاولات بينها ٤٥ ثانية. السبب: تعافي nginx من قتل مفاجئ بياخد
          # ~٢ ثانية، وإعادة تشغيل الباك إند غير مرئية أصلاً — بس فاصل الـ١٥
          # ثانية القديم كان أقصر من عمر بلبلة DNS/شبكة على رَنَر جيت هَب،
          # فكان بيقلب عطل الرَنَر لإنذار كاذب باسم «يقين ساقط».
          check() {
            name="$1"; url="$2"; min="$3"
            body=$(mktemp)
            code=000; size=0
            for i in 1 2 3; do
              # تفريغ الجسم قبل كل محاولة: من غير ده، محاولة فاشلة بتقرا حجم
              # جسم محاولة قبلها وتعدّي بالغلط.
              : > "$body"
              code=$(curl -sS -o "$body" -w '%{http_code}' -m 25 "$url" 2>/dev/null) || code=000
              [ -n "$code" ] || code=000
              size=$(wc -c < "$body" 2>/dev/null || echo 0)
              if [ "$code" = "200" ] && [ "$size" -ge "$min" ]; then
                echo "✅ $name — $code، ${size} بايت (محاولة $i)"
                rm -f "$body"
                return 0
              fi
              echo "… $name محاولة $i: كود=$code حجم=$size"
              [ "$i" -lt 3 ] && sleep 45
            done
            rm -f "$body"
            echo "::error title=$name ساقط::آخر كود=$code حجم=$size — $url"
            return 1
          }

          round() {
            fail=0
            # الحد الأدنى للحجم مقصود: ٢٠٠ بصفحة فاضية = سقوط متنكّر.
            check "الموقع getyaqeen.com"      "https://getyaqeen.com/"               20000 || fail=1
            check "التطبيق app.getyaqeen.com" "https://app.getyaqeen.com/"           20000 || fail=1
            check "الـAPI api.getyaqeen.com"  "https://api.getyaqeen.com/quiz/daily"    10 || fail=1
            return $fail
          }

          # ١٨ نبضة × ٥ دقايق = ٩٠ دقيقة تغطية من تشغيلة واحدة، والتراكب مع
          # التشغيلة اللي بعدها هو اللي بيمنع الفجوة.
          ROUNDS=18
          GAP=300
          n=1
          while [ "$n" -le "$ROUNDS" ]; do
            echo "──── نبضة $n/$ROUNDS — $(date -u '+%H:%M:%S UTC')"
            if ! round; then
              echo "::error::يقين ساقط من خارج السيرفر (نبضة $n) — راجع اللوج فوق"
              exit 1
            fi
            n=$((n + 1))
            [ "$n" -le "$ROUNDS" ] && sleep "$GAP"
          done
          echo "كل الواجهات سليمة طوال $ROUNDS نبضات."
